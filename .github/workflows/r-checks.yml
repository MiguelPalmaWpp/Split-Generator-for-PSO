name: R checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse application code
        run: |
          Rscript -e 'files <- c("app.R", "global.R", "ui.R", "server.R", list.files("R", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)); invisible(lapply(files, parse)); cat("PARSE_OK", length(files), "files\n")'
      - name: Run regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.R; do
            echo "Running $test"
            Rscript "$test"
          done
